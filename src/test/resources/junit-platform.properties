# mvn test                                      -> every scenario
# mvn test -Dcucumber.filter.tags="@smoke"      -> only @smoke
# mvn test -Dcucumber.filter.tags="not @slow"   -> skip the slow ones
cucumber.glue=com.servet.bdd
cucumber.plugin=pretty, html:target/cucumber-report.html, json:target/cucumber.json
cucumber.publish.quiet=true
