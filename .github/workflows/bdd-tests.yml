name: BDD Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI scenarios (saucedemo, headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run the UI scenarios
        run: mvn -B test -Dheadless=true
      - name: Upload the Cucumber report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report-ui
          path: |
            target/cucumber-report.html
            target/cucumber.json
          if-no-files-found: ignore
          retention-days: 14
